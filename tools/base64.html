<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Live Key Converter</title>
</head>
<body>
<h2>Nova Live Base64 Converter</h2>
<input type="file" id="file" accept=".jks">
<button onclick="convert()">Convert</button>
<textarea id="output" style="width:100%;height:250px"></textarea>
<button onclick="copy()">Copy Base64</button>

<script>
async function convert() {
  const file = document.getElementById("file").files[0];
  if (!file) {
    alert("Select JKS file first");
    return;
  }

  const buffer = await file.arrayBuffer();
  const bytes = new Uint8Array(buffer);
  let binary = "";
  const chunk = 8192;

  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
  }

  document.getElementById("output").value = btoa(binary);
}

function copy() {
  const output = document.getElementById("output");
  output.select();
  document.execCommand("copy");
  alert("Copied");
}
</script>
</body>
</html>
