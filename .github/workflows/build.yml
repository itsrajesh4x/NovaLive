name: Build Nova Live

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract NovaLive project
        run: |
          unzip -q NovaLive-Android-Starter.zip -d /tmp/novalive
          cp -R /tmp/novalive/NovaLive/app .
          cp /tmp/novalive/NovaLive/build.gradle.kts .
          cp /tmp/novalive/NovaLive/settings.gradle.kts .
          cp /tmp/novalive/NovaLive/gradle.properties .

      - name: Fix Java Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "    }\n}\ndependencies {",
              """    }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {""",
              1
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Live-APK
          path: app/build/outputs/apk/debug/app-debug.apk
