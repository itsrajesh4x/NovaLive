name: Generate Nova Live Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Random Signing Key
        run: |
          mkdir -p signing

          STORE_PASS=$(openssl rand -hex 24)
          KEY_PASS=$(openssl rand -hex 24)

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          keytool -genkeypair \
            -v \
            -keystore signing/NovaLive-Release.jks \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias novalive-release \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Nova Live, OU=Android, O=Nova Live, L=India, ST=UP, C=IN"

          {
            echo "KEY_ALIAS=novalive-release"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } > signing/Credentials.txt

      - name: Upload Signing Files
        uses: actions/upload-artifact@v4
        with:
          name: NovaLive-Signing-Key
          path: signing/
          retention-days: 1
